name: Workbench Validation

on:
  pull_request:
    paths:
      - OpenClaw-Workbench-Setup.cmd
      - README.md
      - SECURITY.md
      - workbench/**
      - docs/workbench/**
      - extensions/workbench-guardrails/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - ui/package.json
      - ui/src/i18n/locales/en.ts
      - ui/src/pages/workbench/**
      - ui/src/styles/workbench*.css
      - .github/workflows/workbench-installers.yml
  push:
    branches: [main]
    paths:
      - OpenClaw-Workbench-Setup.cmd
      - README.md
      - SECURITY.md
      - workbench/**
      - docs/workbench/**
      - extensions/workbench-guardrails/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - ui/package.json
      - ui/src/i18n/locales/en.ts
      - ui/src/pages/workbench/**
      - ui/src/styles/workbench*.css
      - .github/workflows/workbench-installers.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workbench-validation-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up supported Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
      - name: Installer contract
        run: node --test workbench/install-contract.test.mjs
      - name: Bash syntax
        run: bash -n workbench/install.sh
      - name: ShellCheck
        run: shellcheck workbench/install.sh
      - name: Bash dry run
        run: bash workbench/install.sh --dry-run --skip-onboarding --no-open

  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up supported Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./workbench/install.ps1),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
      - name: PowerShell dry run
        shell: powershell
        run: .\workbench\install.ps1 -DryRun -SkipOnboarding -NoOpen
      - name: Double-click launcher dry run
        shell: cmd
        run: OpenClaw-Workbench-Setup.cmd -DryRun -SkipOnboarding -NoOpen

  workbench:
    name: UI, Guardrails, and build proof
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository dependencies
        uses: ./.github/actions/setup-node-env
        with:
          node-version: 24.x
          install-bun: "false"
          sticky-disk: "false"
          use-actions-cache: "true"
      - name: Audit dependencies
        run: pnpm audit --audit-level moderate
      - name: Verify Workbench translations
        run: pnpm ui:i18n:verify
      - name: Test Workbench and Guardrails
        run: >-
          node scripts/run-vitest.mjs run
          ui/src/pages/workbench/readiness.test.ts
          ui/src/pages/workbench/operations.test.ts
          ui/src/pages/workbench/workbench-page.test.ts
          extensions/workbench-guardrails/src/policy-engine.test.ts
          extensions/workbench-guardrails/src/redaction.test.ts
          extensions/workbench-guardrails/src/trusted-tool-policy.test.ts
          extensions/workbench-guardrails/src/gateway-methods.test.ts
      - name: Build the complete repository
        run: pnpm build
      - name: Install Playwright Chromium
        run: node scripts/ensure-playwright-chromium.mjs
      - name: Exercise the Workbench in Chromium
        run: >-
          node scripts/run-vitest.mjs run
          --config test/vitest/vitest.ui-e2e.config.ts
          --configLoader runner
          ui/src/pages/workbench/workbench.e2e.test.ts
      - name: Upload Workbench visual proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: workbench-ui-proof
          path: .artifacts/control-ui-e2e/workbench/
          if-no-files-found: warn
          retention-days: 14
